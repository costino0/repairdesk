<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairDesk</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header id="header-container">
        <p id="brand">RepairDesk</p>
        <h1 id="title">Repair Requests</h1>
        <p id="description">View and track your repair requests, or submit a new one for any electronic device.</p>
    </header>

    <main id="requests-container">
        <div id="requests-header">
            <h2 id="requests-state">No repair requests yet</h2>
            <button id="add-repair-btn">New Repair Request</button>
        </div>

        <div id="requests">

        </div>

        <form id="request-form" hidden>
            <div id="name-container">
                <label for="name">Customer Name</label>
                <input id="name" name="name" type="text">
            </div>

            <div id="model-container">
                <label for="model">Device Model</label>
                <input id="model" name="model" type="text">
            </div>

            <div id="problem-container">
                <label for="problem">Problem Description</label>
                <input id="problem" name="problem" type="text">
            </div>

            <div id="form-btns">
                <button id="cancel-form-btn" type="button">Cancel</button>
                <button id="submit-form-btn" type="submit">Add Repair Request</button>
            </div>

            <p id="form-error"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
